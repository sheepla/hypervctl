[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/backend-wmi",
    "crates/backend-mock",
    "crates/hypervctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
thiserror = "2"
tokio = "1"
tracing = "0.1"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
tracing-subscriber = "0.3"
crossterm = "0.29"

hypervctl-core = { path = "crates/core" }
hypervctl-backend-wmi = { path = "crates/backend-wmi" }
hypervctl-backend-mock = { path = "crates/backend-mock" }
