[package]
name = "hypervctl-backend-wmi"
version.workspace = true
edition.workspace = true
description = "WMI-backed Hyper-V backend (Windows only)"
publish = false

[dependencies]
thiserror.workspace = true
uuid.workspace = true
hypervctl-core.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Wmi"] }

[dev-dependencies]
uuid.workspace = true
